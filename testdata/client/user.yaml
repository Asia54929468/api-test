test_login:
  - title: 登录成功
    request:
      username_key: client_username
      password_key: client_password
    expected:
      status_code: [200]
      code: 200
      message: "登录成功"
      token_required: true

  - title: 密码错误
    request:
      username_key: client_username
      password: "wrong_password"
    expected:
      status_code: [200, 400, 401, 500]
      code: 500
      message: "用户名或密码错误"
      token_required: false

  - title: 用户名为空
    request:
      username: ""
      password: "123456"
    expected:
      status_code: [200, 400, 401, 500]
      code: 500
      message: "用户名不能为空"
      token_required: false

  - title: 密码为空
    request:
      username_key: client_username
      password: ""
    expected:
      status_code: [200, 400, 401, 500]
      code: 500
      message: "密码不能为空"
      token_required: false

  - title: 用户名不存在
    request:
      username: "not_exist_user"
      password: "123456"
    expected:
      status_code: [200, 400, 401, 500]
      code: 500
      message: "用户名或密码错误"
      token_required: false