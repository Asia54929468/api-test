[pytest]
# 测试相关匹配规则
testpaths = testcase
python_files = test_*.py
python_classes = Test*
python_functions = test_*
# 默认转义中文
disable_test_id_escaping_and_forfeit_all_rights_to_community_support = True

addopts =
    -v
    --html=reports/report.html
    --self-contained-html

markers =
    smoke: 冒烟测试
    regression: 回归测试
    client: 客户端接口
    management: 管理端接口