version: 1
disable_existing_loggers: false

# 日志格式
formatters:
  standard:
    format: "%(asctime)s | %(levelname)-8s | %(name)s | %(message)s"
    datefmt: "%Y-%m-%d %H:%M:%S"

# 日志处理器
handlers:
  file:
    class: logging.handlers.RotatingFileHandler
    level: DEBUG
    formatter: standard
    filename: logs/api_test.log
    encoding: utf-8
    maxBytes: 10485760
    backupCount: 5

# logger设置
loggers:
  api_test:
    level: DEBUG
    handlers:
      - file
    propagate: true

  urllib3:
    level: WARNING
    handlers: []
    propagate: true

  requests:
    level: WARNING
    handlers: []
    propagate: true

root:
  level: WARNING
  handlers: []